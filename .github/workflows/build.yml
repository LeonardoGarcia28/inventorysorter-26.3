name: Build Ohmega Spyglass 26.3

on:
  push:
    branches: [ chatgpt-ohmega-spyglass-build ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Unpack and patch Ohmega Spyglass source for 26.3
        run: |
          unzip -q chatgpt-ohmega-spyglass-source.zip
          sed -i 's/mc\.screen == null/mc.gui.screen() == null/' OhmegaSpyglass-26.3/src/main/java/com/ohmegaspyglass/client/ClientEvents.java
          test -f OhmegaSpyglass-26.3/build.gradle

      - name: Build
        run: gradle -p OhmegaSpyglass-26.3 build --stacktrace

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ohmega-spyglass-26.3
          path: OhmegaSpyglass-26.3/build/libs/*.jar
          if-no-files-found: error
