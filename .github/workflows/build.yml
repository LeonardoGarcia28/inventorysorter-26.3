name: Build Inventory Sorter 26.3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build
        run: gradle build --stacktrace

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: inventorysorter-26.3
          path: build/libs/*.jar
          if-no-files-found: error
