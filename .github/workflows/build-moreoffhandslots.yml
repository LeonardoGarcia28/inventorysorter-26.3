name: Build More Offhand Slots 26.3 Port

on:
  push:
    branches:
      - moreoffhandslots-26.3-port
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Port and build
        run: bash ports/moreoffhandslots/build_port.sh
      - name: Upload JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: moreoffhandslots-26.3-port
          path: artifacts/*.jar
          if-no-files-found: error
