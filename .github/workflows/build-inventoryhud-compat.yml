name: Build Inventory HUD+ 26.3 Compatibility Patch

on:
  workflow_dispatch:
  push:
    branches: [experimental-moreoffhandslots-26.3]
    paths:
      - 'inventoryhud-compat-26.3/**'
      - '.github/workflows/build-inventoryhud-compat.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Obtain official NeoForge 26.3 Gradle wrapper
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/NeoForgeMDKs/MDK-26.3-NeoGradle/archive/refs/heads/main.tar.gz -o mdk.tar.gz
          tar -xzf mdk.tar.gz
          cp MDK-26.3-NeoGradle-main/gradlew inventoryhud-compat-26.3/
          cp MDK-26.3-NeoGradle-main/gradlew.bat inventoryhud-compat-26.3/
          cp -r MDK-26.3-NeoGradle-main/gradle inventoryhud-compat-26.3/
          chmod +x inventoryhud-compat-26.3/gradlew
          grep -F 'gradle-9.2.1-bin.zip' inventoryhud-compat-26.3/gradle/wrapper/gradle-wrapper.properties
      - name: Compile isolated compatibility addon
        shell: bash
        run: |
          set -o pipefail
          cd inventoryhud-compat-26.3
          ./gradlew --no-daemon --no-configuration-cache build --stacktrace 2>&1 | tee ../inventoryhudcompat-build.log
      - name: Verify mixin and mod metadata in compiled jar
        shell: bash
        run: |
          set -euo pipefail
          cd inventoryhud-compat-26.3
          jarfile=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)
          test -n "$jarfile"
          jar tf "$jarfile" | grep -F 'dev/leonardogarcia/inventoryhudcompat/mixin/DisableBrokenUpdateCheckMixin.class'
          jar tf "$jarfile" | grep -F 'inventoryhudcompat.mixins.json'
          unzip -p "$jarfile" META-INF/neoforge.mods.toml | grep -F 'modId="inventoryhudcompat"'
          unzip -p "$jarfile" inventoryhudcompat.mixins.json | grep -F '"DisableBrokenUpdateCheckMixin"'
          javap -private -classpath "$jarfile" dev.leonardogarcia.inventoryhudcompat.mixin.DisableBrokenUpdateCheckMixin
          sha256sum "$jarfile"
      - name: Upload independent fix JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: InventoryHUD-26.3-compatibility-fix-JAR
          path: inventoryhud-compat-26.3/build/libs/*.jar
          if-no-files-found: error
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: InventoryHUD-compat-build-log
          path: inventoryhudcompat-build.log
          if-no-files-found: ignore
