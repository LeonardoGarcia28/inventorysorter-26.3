name: Build Elytra Accessory 26.3 Clean-room

on:
  push:
    branches:
      - elytra-accessory-26.3-cleanroom
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build
        run: gradle -p ports/elytra-accessory-cleanroom clean build --stacktrace

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: elytra-accessory-26.3-cleanroom
          path: ports/elytra-accessory-cleanroom/build/libs/*.jar
          if-no-files-found: error
