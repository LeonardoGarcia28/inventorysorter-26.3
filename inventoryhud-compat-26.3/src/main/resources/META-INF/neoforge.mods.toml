license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Unofficial compatibility patch"
description='''Prevents Inventory HUD+ 3.4.36 from crashing on NeoForge 26.3 when entering a world. Only the obsolete update notification is disabled.'''

[[mixins]]
config="inventoryhudcompat.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="inventoryhud"
type="required"
versionRange="[3.4.36,3.4.37)"
ordering="AFTER"
side="CLIENT"
